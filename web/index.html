<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dazza</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2353C66A'/%3E%3Cpath d='M9 8h8a7 7 0 0 1 0 14h-8z' fill='%230E1525'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('dazza-theme') || 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
